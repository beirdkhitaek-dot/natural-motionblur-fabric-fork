name: build
on:
  push:
    branches: [ "1.21.11" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
      - name: Private draft test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-test --yes --cleanup-tag || true
          gh release create dev-test build/libs/*.jar --draft --prerelease --title "PRIVATE test build" --notes "Private test build"
